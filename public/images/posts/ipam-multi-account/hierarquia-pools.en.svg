<rect x="290" y="572" width="420" height="64" rx="8" fill="#fbe9c8" stroke="#b66b13" stroke-width="2"/>
<text x="304" y="598" class="s b" font-size="17" fill="#202a30">AWS RAM · ipam-environment-pools</text>
<text x="304" y="622" class="m" font-size="15" fill="#202a30">principal: workloads OU</text>
<rect x="24" y="712" width="952" height="200" rx="12" fill="#f3f6f7" stroke="#52616b" stroke-width="2"/>
