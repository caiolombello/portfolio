<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="936" viewBox="0 0 1000 936" role="img" aria-labelledby="title desc">
<title id="title">Multi-account IPAM: the example's pool hierarchy</title>
<desc id="desc">In the network account, the default private scope holds the 10.0.0.0/8 root with no locale. It splits into two Regional pools, sa-east-1 10.0.0.0/12 and us-east-1 10.16.0.0/12, and each Region into /14 environment pools for prod, nonprod and shared, with a fourth /14 reserved and not provisioned. The environment pools have a /16 minimum, /24 maximum and /20 default netmask and are shared through AWS RAM with the workloads OU. In the production account, the payments-prod VPC requests a /20 from the sa-east-1/prod pool.</desc>
<style>.s{font-family:Geist, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif}.m{font-family:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}</style>
<defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b66b13"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#39764a"/></marker></defs>
