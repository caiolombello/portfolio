<rect x="44" y="764" width="912" height="128" rx="8" fill="#e2efe4" stroke="#39764a" stroke-width="2"/>
<text x="58" y="792" class="s b" font-size="17" fill="#202a30">VPC payments-prod</text>
<text x="58" y="818" class="m" font-size="15" fill="#202a30">ipv4_ipam_pool_id = sa-east-1/prod pool</text>
<text x="58" y="842" class="m" font-size="15" fill="#202a30">ipv4_netmask_length = 20</text>
<text x="58" y="870" class="s" font-size="15" fill="#315b3b">IPAM picks the next free /20 in 10.0.0.0/14</text>
<path d="M500 636 V760" fill="none" stroke="#39764a" stroke-width="2.5" marker-end="url(#a-green)"/>
