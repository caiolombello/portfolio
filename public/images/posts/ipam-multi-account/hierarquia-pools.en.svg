<text x="58" y="510" font-size="16" fill="#202a30"><tspan class="s b">Environment pool rules:</tspan><tspan class="m" font-size="15" dx="8">min /16 · max /24 · default /20</tspan></text>
<path d="M264 528 V550 H350 V568" fill="none" stroke="#b66b13" stroke-width="2.5" marker-end="url(#a-amber)"/>
<path d="M736 528 V550 H650 V568" fill="none" stroke="#b66b13" stroke-width="2.5" marker-end="url(#a-amber)"/>
