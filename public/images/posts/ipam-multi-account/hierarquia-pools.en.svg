<rect x="270" y="376" width="214" height="84" rx="8" fill="#f3f6f7" stroke="#7a878e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="284" y="402" class="s b" font-size="17" fill="#202a30">reserve</text>
<text x="284" y="426" class="m" font-size="15" fill="#52616b">10.12.0.0/14</text>
<text x="284" y="448" class="s" font-size="14" fill="#52616b">not provisioned</text>
<line x1="264" y1="264" x2="264" y2="280" stroke="#7a878e" stroke-width="2.5"/>
<rect x="516" y="200" width="440" height="64" rx="8" fill="#ffffff" stroke="#7a878e" stroke-width="2"/>
