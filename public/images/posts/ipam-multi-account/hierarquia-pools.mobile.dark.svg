<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1248" viewBox="0 0 600 1248" role="img" aria-labelledby="title desc">
<title id="title">IPAM multi-account: hierarquia de pools do exemplo</title>
<desc id="desc">Na conta de rede, o escopo privado padrão contém a raiz 10.0.0.0/8 sem locale. Ela se divide em dois pools regionais, sa-east-1 10.0.0.0/12 e us-east-1 10.16.0.0/12, e cada região em pools de ambiente /14 para prod, nonprod e shared, com um quarto /14 reservado e não provisionado. Os pools de ambiente têm máscara mínima /16, máxima /24 e padrão /20 e são compartilhados pelo AWS RAM com a OU de workloads. Na conta de produção, a VPC pagamentos-prod pede um /20 ao pool sa-east-1/prod.</desc>
<style>.s{font-family:Geist, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif}.m{font-family:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.b{font-weight:600}</style>
<defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e39b45"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6cc489"/></marker></defs>
<rect width="600" height="1248" fill="#151719"/>
<rect x="24" y="24" width="552" height="944" rx="12" fill="#1c2024" stroke="#8a969c" stroke-width="2"/>
<text x="44" y="56" class="s b" font-size="20" fill="#e6e9eb">Conta de rede · região home do IPAM</text>
<text x="44" y="82" class="s" font-size="16" fill="#a7b2b9">Escopo privado padrão</text>
<rect x="44" y="100" width="512" height="64" rx="8" fill="#3a2c17" stroke="#e39b45" stroke-width="2"/>
<text x="58" y="126" class="s b" font-size="17" fill="#e6e9eb">Raiz</text>
<text x="58" y="150" class="m" font-size="15" fill="#e6e9eb">10.0.0.0/8 · sem locale</text>
<rect x="44" y="200" width="512" height="64" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="226" class="s b" font-size="17" fill="#e6e9eb">sa-east-1</text>
<text x="58" y="250" class="m" font-size="15" fill="#a7b2b9">10.0.0.0/12 · locale sa-east-1</text>
<rect x="44" y="280" width="250" height="84" rx="8" fill="#1d3326" stroke="#6cc489" stroke-width="2"/>
<text x="58" y="306" class="s b" font-size="17" fill="#e6e9eb">prod</text>
<text x="58" y="330" class="m" font-size="15" fill="#e6e9eb">10.0.0.0/14</text>
<rect x="306" y="280" width="250" height="84" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="320" y="306" class="s b" font-size="17" fill="#e6e9eb">nonprod</text>
<text x="320" y="330" class="m" font-size="15" fill="#a7b2b9">10.4.0.0/14</text>
<rect x="44" y="376" width="250" height="84" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="402" class="s b" font-size="17" fill="#e6e9eb">shared</text>
<text x="58" y="426" class="m" font-size="15" fill="#a7b2b9">10.8.0.0/14</text>
<rect x="306" y="376" width="250" height="84" rx="8" fill="#1c2024" stroke="#75828a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320" y="402" class="s b" font-size="17" fill="#e6e9eb">reserva</text>
<text x="320" y="426" class="m" font-size="15" fill="#a7b2b9">10.12.0.0/14</text>
<text x="320" y="448" class="s" font-size="14" fill="#a7b2b9">não provisionada</text>
<line x1="300" y1="264" x2="300" y2="280" stroke="#75828a" stroke-width="2.5"/>
<rect x="44" y="488" width="512" height="64" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="514" class="s b" font-size="17" fill="#e6e9eb">us-east-1</text>
<text x="58" y="538" class="m" font-size="15" fill="#a7b2b9">10.16.0.0/12 · locale us-east-1</text>
<rect x="44" y="568" width="250" height="84" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="594" class="s b" font-size="17" fill="#e6e9eb">prod</text>
<text x="58" y="618" class="m" font-size="15" fill="#a7b2b9">10.16.0.0/14</text>
<rect x="306" y="568" width="250" height="84" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="320" y="594" class="s b" font-size="17" fill="#e6e9eb">nonprod</text>
<text x="320" y="618" class="m" font-size="15" fill="#a7b2b9">10.20.0.0/14</text>
<rect x="44" y="664" width="250" height="84" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="690" class="s b" font-size="17" fill="#e6e9eb">shared</text>
<text x="58" y="714" class="m" font-size="15" fill="#a7b2b9">10.24.0.0/14</text>
<rect x="306" y="664" width="250" height="84" rx="8" fill="#1c2024" stroke="#75828a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320" y="690" class="s b" font-size="17" fill="#e6e9eb">reserva</text>
<text x="320" y="714" class="m" font-size="15" fill="#a7b2b9">10.28.0.0/14</text>
<text x="320" y="736" class="s" font-size="14" fill="#a7b2b9">não provisionada</text>
<line x1="300" y1="552" x2="300" y2="568" stroke="#75828a" stroke-width="2.5"/>
<path d="M300 164 V182 H34 V520 H44" fill="none" stroke="#75828a" stroke-width="2.5"/>
<line x1="34" y1="232" x2="44" y2="232" stroke="#75828a" stroke-width="2.5"/>
<rect x="44" y="768" width="512" height="72" rx="8" fill="#22272c" stroke="#75828a" stroke-width="2"/>
<text x="58" y="796" class="s b" font-size="16" fill="#e6e9eb">Regras dos pools de ambiente</text>
<text x="58" y="822" class="m" font-size="15" fill="#e6e9eb">mín. /16 · máx. /24 · padrão /20</text>
<path d="M300 840 V880" fill="none" stroke="#e39b45" stroke-width="2.5" marker-end="url(#a-amber)"/>
<text x="312" y="864" class="s" font-size="15" fill="#f0b46a">pools de ambiente</text>
<rect x="44" y="884" width="512" height="64" rx="8" fill="#3a2c17" stroke="#e39b45" stroke-width="2"/>
<text x="58" y="910" class="s b" font-size="17" fill="#e6e9eb">AWS RAM · ipam-pools-ambiente</text>
<text x="58" y="934" class="m" font-size="15" fill="#e6e9eb">principal: OU de workloads</text>
<rect x="24" y="1024" width="552" height="200" rx="12" fill="#1c2024" stroke="#8a969c" stroke-width="2"/>
<text x="44" y="1056" class="s b" font-size="20" fill="#e6e9eb">Conta de produção · sa-east-1</text>
<rect x="44" y="1076" width="512" height="128" rx="8" fill="#1d3326" stroke="#6cc489" stroke-width="2"/>
<text x="58" y="1104" class="s b" font-size="17" fill="#e6e9eb">VPC pagamentos-prod</text>
<text x="58" y="1130" class="m" font-size="15" fill="#e6e9eb">ipv4_ipam_pool_id = pool sa-east-1/prod</text>
<text x="58" y="1154" class="m" font-size="15" fill="#e6e9eb">ipv4_netmask_length = 20</text>
<text x="58" y="1182" class="s" font-size="15" fill="#7fcf98">IPAM escolhe o próximo /20 livre em 10.0.0.0/14</text>
<path d="M300 948 V1072" fill="none" stroke="#6cc489" stroke-width="2.5" marker-end="url(#a-green)"/>
<text x="312" y="1002" class="s" font-size="15" fill="#7fcf98">aloca um /20</text>
</svg>
