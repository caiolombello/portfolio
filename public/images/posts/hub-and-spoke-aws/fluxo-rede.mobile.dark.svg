<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2017" viewBox="0 0 600 2017" role="img" aria-labelledby="title desc">
<title id="title">Hub and spoke na AWS: ida e volta pelo Transit Gateway</title>
<desc id="desc">VPCs de produção e de desenvolvimento ligadas ao Transit Gateway, com saída central por NAT Gateway e Internet Gateway na VPC de saída. A ida usa rt-producao; a volta, em quatro passos numerados, usa a rota mais específica da sub-rede pública e rt-retorno. Blackholes separam os ambientes.</desc>
