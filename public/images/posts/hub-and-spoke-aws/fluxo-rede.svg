<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1710" viewBox="0 0 1000 1710" role="img" aria-labelledby="title desc">
<title id="title">Hub and spoke na AWS: ida, retorno e separação entre ambientes</title>
<desc id="desc">Exemplo fictício IPv4 com produção e desenvolvimento na Transit Gateway. O tráfego público segue ao NAT zonal na VPC de saída e ao Internet Gateway. O retorno consulta rt-retorno. Blackholes bloqueiam os CIDRs dos ambientes entre si.</desc>
