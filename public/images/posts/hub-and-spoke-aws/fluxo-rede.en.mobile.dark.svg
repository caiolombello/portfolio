<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1991" viewBox="0 0 600 1991" role="img" aria-labelledby="title desc">
<title id="title">Hub and spoke on AWS: the round trip through Transit Gateway</title>
<desc id="desc">Production and development VPCs attached to Transit Gateway, with centralized egress through a NAT Gateway and an Internet Gateway in the egress VPC. The request uses rt-production; the response, in four numbered steps, uses the public subnet's more specific route and rt-return. Blackholes separate the environments.</desc>
